<!DOCTYPE html>

    <title>Student Management System</title>

</head>
<body>

    <div class="navbar">
     ABC COLLEGE OF ENGINEERING
    </div>

    <!-- Departments Section -->

        <h2>Our Departments</h2>
        <div class="departments">
            <div class="dept">Computer Science</div>
            <div class="dept">Information Technology</div>
            <div class="dept">Electronics</div>

        <div class="login-buttons">
            <button onclick="goToAdminLogin()">Admin Login</button>

            <button onclick="teacherLogin()">Teacher Login</button>

    <script src="script.js"></script>
